<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aprendo mi Papel · Colegio Waldorf Michelangelo</title>
  <meta name="description" content="Sube el libreto de tu obra, elige tu personaje y apréndete tus líneas de forma rápida y didáctica.">
  <meta name="theme-color" content="#fbf6ee">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand"><span class="brand-mark" aria-hidden="true">🎭</span><span>Aprendo mi Papel</span></a>
  </header>

  <main id="app" aria-live="polite"></main>

  <footer class="footer">Hecho con cariño para el Colegio Waldorf Michelangelo 🌿</footer>

  <div id="busy" class="busy" hidden>
    <div class="busy-card">
      <div class="spinner" aria-hidden="true"></div>
      <p id="busyMsg">Un momento…</p>
      <div class="bar"><span id="busyBar"></span></div>
    </div>
  </div>

  <div id="toast" role="status"></div>

  <dialog id="settingsDialog" class="dialog">
    <form method="dialog">
      <h2>Ajustes</h2>
      <label class="field">
        <span>Velocidad de lectura <b id="setRateVal">1.0×</b></span>
        <input type="range" id="setRate" min="0.6" max="1.6" step="0.1" value="1">
      </label>
      <label class="field">
        <span>Español de</span>
        <select id="setLang" class="input">
          <option value="es-ES">España</option>
          <option value="es-CL">Chile</option>
          <option value="es-AR">Argentina</option>
          <option value="es-MX">México</option>
          <option value="es-CO">Colombia</option>
          <option value="es-PE">Perú</option>
          <option value="es-US">Estados Unidos</option>
        </select>
      </label>
      <label class="switch"><input type="checkbox" id="setDirections"><span></span>Leer las acotaciones en voz alta</label>
      <button type="button" class="btn ghost" id="setTest">🔊 Probar la voz</button>
      <hr>
      <button type="button" class="btn danger small" id="resetProgress">Reiniciar mi progreso en esta obra</button>
      <div class="actions">
        <button class="btn ghost" value="cancel">Cancelar</button>
        <button class="btn primary" value="save">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="js/storage.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/extract.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/share.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
